<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Doe ou compre – EcoBola</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>try { var t = localStorage.getItem("eb-theme"); if (t) document.documentElement.dataset.theme = t } catch (e) { }</script>
</head>

<body>
    <div id="site-header"></div>
    <main>
        <section id="doar">
            <h1>Doe material ou peça orçamento</h1>
            <p>Escolas, empresas, clubes e prefeituras: conte o que você tem ou precisa e retornamos em até 2 dias
                úteis.</p>
            <form id="f">
                <label>Você é<select name="tipo">
                        <option>Escola</option>
                        <option>Empresa</option>
                        <option>Borracharia</option>
                        <option>Prefeitura ou órgão público</option>
                        <option>Quero comprar pisos</option>
                        <option>Outro</option>
                    </select></label>
                <label>Nome ou instituição<input name="nome" required></label>
                <label>E-mail<input name="email" type="email" required></label>
                <label>Telefone ou WhatsApp<input name="tel" type="tel"></label>
                <label>Cidade<input name="cidade" required></label>
                <fieldset>
                    <legend>Material</legend><label><input type="checkbox" name="mat" value="Pneus">
                        Pneus</label><label><input type="checkbox" name="mat" value="Bolas furadas"> Bolas
                        furadas</label><label><input type="checkbox" name="mat" value="Câmaras de ar"> Câmaras de
                        ar</label><label><input type="checkbox" name="mat" value="Outras borrachas"> Outras
                        borrachas</label>
                </fieldset>
                <label>Quantidade aproximada<input name="qtd" placeholder="Ex.: 40 pneus, 15 bolas"></label>
                <label>Mensagem<textarea name="obs" rows="3"></textarea></label>
                <button class="btn" type="submit">Enviar solicitação</button>
                <p id="msg" role="status"></p>
            </form>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="script.js"></script>
</body>

</html>
